name: Deploy CRM to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::072508717210:role/movira-github-actions-deploy
  ARTIFACT_BUCKET: movira-deploy-072508717210-ap-south-1
  INSTANCE_ID: i-04b24ccadd1321a1c

jobs:
  deploy:
    name: Package and deploy CRM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check config/config.js
          node --check src/config/index.js
          node --check src/db/sequelize.js
          node --check src/server.js

      - name: Test
        run: npm test

      - name: Package CRM
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            -czf /tmp/crm.tar.gz .

      - name: Upload artifact
        run: aws s3 cp /tmp/crm.tar.gz "s3://${ARTIFACT_BUCKET}/crm.tar.gz"

      - name: Deploy CRM on EC2
        run: |
          cat > /tmp/movira-crm-remote.sh <<REMOTE
          set -euo pipefail

          aws s3 cp s3://${ARTIFACT_BUCKET}/crm.tar.gz /tmp/movira-crm.tar.gz --region ${AWS_REGION}

          rm -rf /opt/movira/crm.release
          mkdir -p /opt/movira/crm.release
          tar --warning=no-unknown-keyword -xzf /tmp/movira-crm.tar.gz -C /opt/movira/crm.release

          if [ -f /opt/movira/crm/.env ]; then
            cp /opt/movira/crm/.env /tmp/movira-crm.env
          fi

          rm -rf /opt/movira/crm.previous
          if [ -d /opt/movira/crm ]; then
            mv /opt/movira/crm /opt/movira/crm.previous
          fi

          mv /opt/movira/crm.release /opt/movira/crm

          if [ -f /tmp/movira-crm.env ]; then
            cp /tmp/movira-crm.env /opt/movira/crm/.env
          fi

          cd /opt/movira/crm
          npm install --no-audit --no-fund
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed:all
          pm2 restart movira-crm --update-env || pm2 start src/server.js --name movira-crm --time
          pm2 restart movira-crm-transactional-worker --update-env || pm2 start src/workers/transactionalWorker.js --name movira-crm-transactional-worker --time
          pm2 restart movira-crm-marketing-worker --update-env || pm2 start src/workers/marketingWorker.js --name movira-crm-marketing-worker --time
          pm2 save
          systemctl restart nginx

          echo "Waiting for movira-crm health check..."
          attempt=1
          until curl -fsS http://127.0.0.1:4100/health; do
            if [ "\$attempt" -ge 30 ]; then
              echo "movira-crm health check failed after \$attempt attempts"
              pm2 status movira-crm || true
              pm2 logs movira-crm --lines 120 --nostream || true
              exit 1
            fi
            echo "movira-crm is not ready yet; retrying (\$attempt/30)..."
            attempt=\$((attempt + 1))
            sleep 2
          done
          REMOTE

          jq -n --rawfile script /tmp/movira-crm-remote.sh '{commands: [$script]}' \
            > /tmp/movira-crm-ssm-commands.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Movira CRM from GitHub Actions" \
            --parameters file:///tmp/movira-crm-ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"; then
            aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode}'
