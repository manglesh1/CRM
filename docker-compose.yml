version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: movira_user
      POSTGRES_PASSWORD: movira_password
      POSTGRES_DB: movira_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movira_user -d movira_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
